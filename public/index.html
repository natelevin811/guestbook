<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Guestbook</h1>
      <p class="subtitle">Leave your mark — say hello!</p>
    </header>

    <div class="auth-bar">
      <div id="auth-signed-out">
        <button type="button" id="show-signin-btn" class="btn-text">Sign In</button>
      </div>
      <div id="auth-signed-in" hidden>
        <span id="auth-email-display" class="auth-email"></span>
        <button type="button" id="signout-btn" class="btn-text">Sign Out</button>
      </div>
    </div>

    <div class="signin-panel" id="signin-panel" hidden>
      <h3>Sign In</h3>
      <form id="signin-form">
        <div class="field">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <div class="field">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="auth-actions">
          <button type="submit" id="signin-submit">Sign In</button>
          <button type="button" id="cancel-signin" class="btn-ghost">Cancel</button>
        </div>
        <p class="error-msg" id="auth-error" hidden></p>
      </form>
    </div>

    <section class="form-section">
      <form id="guestbook-form">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" placeholder="Ada Lovelace" maxlength="80" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write something nice…" maxlength="500" rows="4" required></textarea>
        </div>
        <button type="submit" id="submit-btn">Sign the book</button>
        <p class="error-msg" id="error-msg" hidden></p>
      </form>
    </section>

    <section class="entries-section">
      <h2>Entries <span id="entry-count" class="count"></span></h2>
      <div id="entries-list" class="entries-list">
        <p class="empty-state" id="empty-state">No entries yet — be the first!</p>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
