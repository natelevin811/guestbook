<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guestbook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Guestbook</h1>
      <p class="subtitle">Leave your mark — say hello!</p>
    </header>

    <section class="form-section">
      <form id="guestbook-form">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" placeholder="Ada Lovelace" maxlength="80" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write something nice…" maxlength="500" rows="4" required></textarea>
        </div>
        <button type="submit" id="submit-btn">Sign the book</button>
        <p class="error-msg" id="error-msg" hidden></p>
      </form>
    </section>

    <section class="entries-section">
      <h2>Entries <span id="entry-count" class="count"></span></h2>
      <div id="entries-list" class="entries-list">
        <p class="empty-state" id="empty-state">No entries yet — be the first!</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
