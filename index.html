<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreeWindow — connect your calendar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>FreeWindow</h1>
    <p class="tagline">Connect your calendar once. We’ll ping the group when you’re all free.</p>

    <form id="connect-form">
      <label for="name">Your name</label>
      <input id="name" name="name" type="text" placeholder="e.g. Alex" autocomplete="given-name" maxlength="40" required />
      <button id="connect-btn" type="submit">
        <span class="g-icon" aria-hidden="true">G</span>
        Connect Google Calendar
      </button>
    </form>

    <p class="privacy">We only read your <strong>free/busy</strong> times — never event titles or details.</p>

    <div id="status" class="status" hidden></div>

    <section id="crew" class="crew" hidden>
      <h2>Crew connected</h2>
      <ul id="crew-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
